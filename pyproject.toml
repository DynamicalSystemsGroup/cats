[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cats*"]

[project]
name = "cats"
version = "0.0.0"
authors = [
  { name="Joshua E. Jodesty", email="joshua@dynamicalsystemsgroup.com"},
]
maintainers = [
  { name="Joshua E. Jodesty", email="joshua@dynamicalsystemsgroup.com"},
]
description = "CATs"
readme = "README.md"
requires-python = ">=3.12.5"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.31.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "cloudpickle>=3.0.0",
    "cryptography>=42.0.0",
    "rfc8785>=0.1.0",
]

[project.optional-dependencies]
ops = [
    "ray[default,data]>=2.45.0",
    "pandas>=2.2.3",
    "marimo>=0.23.0",
    "tqdm>=4.66.5",
    "pyarrow>=18.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "build",
    "code2flow",
    "pylint",
]

[project.urls]
Homepage = "https://github.com/DynamicalSystemsGroup/cats"
Issues = "https://github.com/DynamicalSystemsGroup/cats/issues"
